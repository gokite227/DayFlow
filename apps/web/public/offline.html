<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8fb" />
    <title>DayFlow</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #fff8fb;
        color: #2d2730;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .brand {
        font-size: 26px;
        font-weight: 850;
        letter-spacing: -0.5px;
      }
      .brand span {
        color: #ee749d;
      }
      p {
        margin: 0;
        color: #8f838b;
      }
      button {
        justify-self: center;
        margin-top: 8px;
        border: 0;
        border-radius: 11px;
        padding: 10px 16px;
        background: #ee749d;
        color: #fff;
        font: inherit;
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Day<span>Flow</span></div>
      <strong>인터넷 연결이 필요해요.</strong>
      <p>연결을 확인한 뒤 다시 시도해주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
