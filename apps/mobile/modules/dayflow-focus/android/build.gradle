plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.dayflow.focus'
version = '0.1.0'

android {
  namespace "app.dayflow.focus"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // FocusPolicyTest: ./gradlew :dayflow-focus:testDebugUnitTest (pure Kotlin, no device needed)
  testImplementation 'junit:junit:4.13.2'
}
