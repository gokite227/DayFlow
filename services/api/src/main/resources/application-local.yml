spring:
  config:
    # Reuses infra/.env (git-ignored) when started from services/api. Environment
    # variables with the same names take precedence.
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dayflow}
    username: ${POSTGRES_USER:dayflow}
    # No default: the password must come from infra/.env or the environment.
    password: ${POSTGRES_PASSWORD}

dayflow:
  public-base-url: ${DAYFLOW_PUBLIC_BASE_URL:http://localhost:8080}
  web:
    # Next.js dev server.
    url: ${DAYFLOW_WEB_URL:http://localhost:3000}
    allowed-origins: ${DAYFLOW_ALLOWED_WEB_ORIGINS:http://localhost:3000}
  auth:
    # Local development only; the prod profile refuses this value.
    jwt-secret: ${DAYFLOW_JWT_SECRET:local-development-only-jwt-secret-change-me}
    refresh-cookie:
      # http://localhost has no TLS.
      secure: ${DAYFLOW_REFRESH_COOKIE_SECURE:false}
